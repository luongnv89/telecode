<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 140" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600');
    .wordmark { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; font-size: 64px; }
  </style>

  <!-- Card background with depth -->
  <rect x="4" y="6" width="732" height="132" rx="20" fill="#1A1A1A" opacity="0.3"/>
  <rect x="0" y="0" width="740" height="140" rx="20" fill="#0A0A0A"/>
  <!-- Card border - Gray inner + Green outer -->
  <rect x="1.5" y="1.5" width="737" height="137" rx="18.5" fill="none" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="0" y="0" width="740" height="140" rx="20" fill="none" stroke="#00E676" stroke-width="1.5"/>

  <!-- Mark -->
  <g transform="translate(70,70)">
    <!-- Circle with border depth -->
    <circle cx="0" cy="0" r="44" fill="#111111"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#333333" stroke-width="1"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#00E676" stroke-width="1.5"/>
    <!-- Brackets -->
    <path d="M-12,-18 L-24,0 L-12,18" stroke="#00E676" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M3.5,-18 L-3.5,18" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M12,-18 L24,0 L12,18" stroke="#00E676" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Send accent - Gray -->
    <path d="M28,-4.5 L34,0 L28,4.5" stroke="#888888" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Divider line - Gray -->
  <line x1="135" y1="30" x2="135" y2="110" stroke="#333333" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="155" y="90" class="wordmark">
    <tspan fill="#FFFFFF">tele</tspan><tspan fill="#00E676">code</tspan>
  </text>
</svg>
